name: Publish Modified Recipes

on:
  push:
    branches:
      - master
    paths:
      - 'recipes/**'
      - '.github/workflows/publish.yml'
      - 'scripts/select_recipes.py'
      - 'scripts/verify_recipe_publication.py'
      - 'scripts/test_recipe_publication.py'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/select_recipes.py'
      - 'scripts/verify_recipe_publication.py'
      - 'scripts/test_recipe_publication.py'
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Specific recipe to publish (e.g. drogon), or leave empty for all changed'
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: recipe-publication-${{ github.event_name == 'pull_request' && github.ref || 'remote' }}
  cancel-in-progress: false

env:
  CONAN_REMOTE_NAME: chess-one

jobs:
  validate:
    name: Test publication logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_recipe_publication.py' -v

  publish:
    name: Export & Upload Recipes
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Conan
        env:
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME || 'patchwork' }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONIOENCODING: utf-8
        run: |
          pip3 install conan
          conan profile detect --force

          conan remote remove conancenter || true
          conan remote add ${{ env.CONAN_REMOTE_NAME }} "$CONAN_REMOTE_URL" --index 0
          conan remote login ${{ env.CONAN_REMOTE_NAME }} "$CONAN_USERNAME" -p "$CONAN_PASSWORD"

      - name: Detect changed recipes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RECIPE: ${{ inputs.recipe }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?status=success&event=push&per_page=100" \
            > /tmp/publication-history.json
          python3 scripts/select_recipes.py \
            --history /tmp/publication-history.json \
            --run-id "$GITHUB_RUN_ID" --branch "$GITHUB_REF_NAME" \
            --recipe "$REQUESTED_RECIPE" > /tmp/changed_recipes.txt

          if [[ ! -s /tmp/changed_recipes.txt ]]; then
            echo "No changed recipes found"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed recipes:"
            cat /tmp/changed_recipes.txt
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export and upload recipes
        if: steps.detect.outputs.has_changes == 'true'
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONIOENCODING: utf-8
        run: |
          FAILED=()

          while IFS= read -r RECIPE; do
            RECIPE_DIR="recipes/${RECIPE}"
            CONFIG_FILE="${RECIPE_DIR}/config.yml"

            if [[ ! -f "$CONFIG_FILE" ]]; then
              echo "::warning::No config.yml found for ${RECIPE}, skipping"
              continue
            fi

            # Parse versions and their folders from config.yml
            VERSIONS=$(python3 -c "
          import yaml, sys
          with open('$CONFIG_FILE') as f:
              cfg = yaml.safe_load(f)
          for ver, data in cfg.get('versions', {}).items():
              folder = data.get('folder', 'all')
              print(f'{ver}:{folder}')
          ")

            if [[ -z "$VERSIONS" ]]; then
              echo "::warning::No versions found in $CONFIG_FILE, skipping"
              continue
            fi

            : > /tmp/exported-revisions.txt
            for entry in $VERSIONS; do
              VERSION="${entry%%:*}"
              FOLDER="${entry##*:}"
              RECIPE_PATH="${RECIPE_DIR}/${FOLDER}"

              # Conan 1-only recipes kept for history cannot be exported by Conan 2
              # (scripts/export_and_upload_all.sh skips them the same way).
              if grep -qE '^\s*from conans import' "${RECIPE_PATH}/conanfile.py"; then
                echo "::warning::Skipping Conan 1 recipe ${RECIPE}/${VERSION}"
                continue
              fi

              echo "=== Exporting ${RECIPE}/${VERSION} from ${RECIPE_PATH} ==="
              if ! conan export "${RECIPE_PATH}" --name="${RECIPE}" --version="${VERSION}" \
                --format=json > /tmp/exported-recipe.json; then
                echo "::error::Failed to export ${RECIPE}/${VERSION}"
                FAILED+=("${RECIPE}/${VERSION}")
                continue
              fi
              python3 -c 'import json; print(json.load(open("/tmp/exported-recipe.json"))["reference"])' \
                >> /tmp/exported-revisions.txt
            done

            echo "=== Uploading ${RECIPE} recipes ==="
            conan upload "${RECIPE}/*" --remote ${{ env.CONAN_REMOTE_NAME }} --confirm --only-recipe || {
              echo "::error::Failed to upload ${RECIPE}"
              FAILED+=("${RECIPE}")
            }
            python3 scripts/verify_recipe_publication.py "$CONAN_REMOTE_NAME" /tmp/exported-revisions.txt || {
              echo "::error::Remote verification failed for ${RECIPE}"
              FAILED+=("${RECIPE}")
            }
          done < /tmp/changed_recipes.txt

          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "::error::Failed recipes: ${FAILED[*]}"
            exit 1
          fi

          echo "All recipes exported and uploaded successfully"
