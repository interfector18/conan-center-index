name: Publish Modified Recipes

on:
  push:
    branches:
      - master
    paths:
      - 'recipes/**'
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Specific recipe to publish (e.g. drogon), or leave empty for all changed'
        required: false

env:
  CONAN_REMOTE_NAME: chess-one

jobs:
  detect-changes:
    name: Detect Changed Recipes
    runs-on: ubuntu-24.04
    outputs:
      recipes: ${{ steps.detect.outputs.recipes }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream for diff
        run: |
          git remote add upstream https://github.com/conan-io/conan-center-index.git 2>/dev/null || true
          git fetch upstream master

      - name: Detect changed recipes
        id: detect
        run: |
          if [[ -n "${{ github.event.inputs.recipe }}" ]]; then
            # Manual trigger with specific recipe
            RECIPES='["${{ github.event.inputs.recipe }}"]'
          else
            # Find recipes that differ from upstream
            CHANGED_DIRS=$(git diff --name-only upstream/master -- recipes/ \
              | grep -oP '^recipes/\K[^/]+' \
              | sort -u)

            if [[ -z "$CHANGED_DIRS" ]]; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "recipes=[]" >> "$GITHUB_OUTPUT"
              echo "No changed recipes found"
              exit 0
            fi

            # Build JSON array
            RECIPES=$(echo "$CHANGED_DIRS" | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "recipes=$RECIPES" >> "$GITHUB_OUTPUT"
          echo "Recipes to publish: $RECIPES"

  publish:
    name: Publish ${{ matrix.recipe }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJson(needs.detect-changes.outputs.recipes) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Conan
        env:
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME || 'patchwork' }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONIOENCODING: utf-8
        run: |
          pip3 install conan
          conan profile detect --force

          conan remote add ${{ env.CONAN_REMOTE_NAME }} "$CONAN_REMOTE_URL" --index 0
          conan remote login ${{ env.CONAN_REMOTE_NAME }} "$CONAN_USERNAME" -p "$CONAN_PASSWORD"

      - name: Export and upload ${{ matrix.recipe }} recipes
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONIOENCODING: utf-8
        run: |
          RECIPE_DIR="recipes/${{ matrix.recipe }}"
          CONFIG_FILE="${RECIPE_DIR}/config.yml"

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "::error::No config.yml found for ${{ matrix.recipe }}"
            exit 1
          fi

          # Parse versions and their folders from config.yml
          # Format: versions:\n  "1.2.3":\n    folder: "all"
          VERSIONS=$(python3 -c "
          import yaml, sys
          with open('$CONFIG_FILE') as f:
              cfg = yaml.safe_load(f)
          for ver, data in cfg.get('versions', {}).items():
              folder = data.get('folder', 'all')
              print(f'{ver}:{folder}')
          ")

          if [[ -z "$VERSIONS" ]]; then
            echo "::error::No versions found in $CONFIG_FILE"
            exit 1
          fi

          for entry in $VERSIONS; do
            VERSION="${entry%%:*}"
            FOLDER="${entry##*:}"
            RECIPE_PATH="${RECIPE_DIR}/${FOLDER}"

            echo "=== Exporting ${{ matrix.recipe }}/${VERSION} from ${RECIPE_PATH} ==="
            conan export "${RECIPE_PATH}" --name="${{ matrix.recipe }}" --version="${VERSION}"
          done

          echo "=== Uploading ${{ matrix.recipe }} recipes ==="
          conan upload "${{ matrix.recipe }}/*" --remote ${{ env.CONAN_REMOTE_NAME }} --confirm --only-recipe
